<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Vale OS · tu buscador de vacantes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="v2.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/hoy" aria-label="Vale OS inicio">
      <span class="brand-mark">V</span>
      <span class="brand-text">vale<em>os</em></span>
    </a>
    <nav class="desktop-nav" aria-label="Navegación principal">
      <a href="#/hoy" data-route="hoy">Hoy</a>
      <a href="#/vacantes" data-route="vacantes">Vacantes</a>
      <a href="#/mercado" data-route="mercado">Mercado</a>
      <a href="#/empresas" data-route="empresas">Empresas</a>
      <a href="#/aplicaciones" data-route="aplicaciones">Aplicaciones</a>
      <a href="#/cv" data-route="cv">CV</a>
      <a href="#/recursos" data-route="recursos">Recursos</a>
    </nav>
    <div class="topbar-actions">
      <button id="theme-btn" class="icon-btn" aria-label="Cambiar tema" title="Tema">◐</button>
      <button id="settings-btn" class="icon-btn" aria-label="Ajustes" title="Ajustes">⚙</button>
      <div id="sync-status" class="sync-status" title="Sincronización">☁️</div>
      <div class="level-pill" id="level-pill" title="Tu nivel">Lv 1</div>
    </div>
  </header>

  <main id="app" class="app">
    <section id="view-hoy" class="view"></section>
    <section id="view-vacantes" class="view"></section>
    <section id="view-mercado" class="view"></section>
    <section id="view-empresas" class="view"></section>
    <section id="view-aplicaciones" class="view"></section>
    <section id="view-cv" class="view"></section>
    <section id="view-recursos" class="view"></section>
    <section id="view-ajustes" class="view"></section>
  </main>

  <nav class="bottom-nav" aria-label="Navegación móvil">
    <a href="#/hoy" data-route="hoy"><span>◉</span>Hoy</a>
    <a href="#/vacantes" data-route="vacantes"><span>⌕</span>Vacantes</a>
    <a href="#/mercado" data-route="mercado"><span>▥</span>Mercado</a>
    <a href="#/aplicaciones" data-route="aplicaciones"><span>✦</span>Apps</a>
    <a href="#/cv" data-route="cv"><span>◧</span>CV</a>
  </nav>

  <div id="job-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="job-modal-title">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-close" data-close-modal aria-label="Cerrar">&times;</button>
      <div id="job-modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <span>Vale OS v2 · datos de LinkedIn · <a href="insights.html">análisis completo</a></span>
    <span id="data-stamp"></span>
  </footer>

  <script src="v2.js"></script>
</body>
</html>
